name: Desktop Build

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Optional HTTPS API URL. Empty uses the production API.
        required: false
        default: ''
        type: string
      enable_quick_demo_access:
        description: Enable demo credentials in this deliberate desktop build.
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional existing or new version tag to publish as a release.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  scope:
    name: Select desktop build source
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.scope.outputs.should_build }}
      source_sha: ${{ steps.scope.outputs.source_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Determine whether a desktop build is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != 'workflow_run' ]]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$SOURCE_SHA^1" "$SOURCE_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(desktop/|frontend/|main\.go$|go\.mod$|go\.sum$|wails\.json$|build/|\.github/workflows/(desktop|ci)\.yml$)'; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Windows Wails build
    needs: scope
    if: needs.scope.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DESKTOP_API_BASE_URL: ${{ inputs.api_base_url }}
      DESKTOP_ENABLE_DEMO_ACCESS: ${{ inputs.enable_quick_demo_access || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Windows executable
        shell: pwsh
        run: |
          $buildArguments = @{
              EnableQuickDemoAccess = [System.Convert]::ToBoolean($env:DESKTOP_ENABLE_DEMO_ACCESS)
          }

          if (-not [string]::IsNullOrWhiteSpace($env:DESKTOP_API_BASE_URL)) {
              $buildArguments.ApiBaseUrl = $env:DESKTOP_API_BASE_URL
          }

          & .\desktop\scripts\build-windows.ps1 @buildArguments
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "build\bin\DashPoint.exe" -PathType Leaf)) {
              throw "build\bin\DashPoint.exe was not produced"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashPoint-windows
          path: build/bin/DashPoint.exe
          if-no-files-found: error

  release:
    name: Publish tagged desktop release
    needs: [scope, build]
    if: >-
      needs.build.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DashPoint-windows
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ needs.scope.outputs.source_sha }}
        run: |
          release_tag="$RELEASE_TAG_INPUT"
          if [ -z "$release_tag" ]; then
            release_tag="$REF_NAME"
          fi

          case "$release_tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must use vMAJOR.MINOR.PATCH format: $release_tag" >&2; exit 1 ;;
          esac

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release/DashPoint.exe --clobber
          else
            gh release create "$release_tag" release/DashPoint.exe --target "$SOURCE_SHA" --generate-notes
          fi
