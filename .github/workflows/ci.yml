name: CI

on:
  push:
    branches:
      - main
      - dashpoint-demo
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Frontend and backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build web frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Keep this aligned with the Go version the Dockerfiles build with.
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Test backend packages
        working-directory: backend
        run: go test ./...

      - name: Scan backend for known Go vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Scan source for common secret material
        run: |
          if rg -n --hidden \
            -g '!.git/**' \
            -g '!frontend/node_modules/**' \
            -g '!frontend/.next/**' \
            -g '!ci/fixtures/compose.env' \
            '(-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|([0-9]{1,3}-){3}[0-9]{1,3}\.nip\.io)' .; then
            echo 'Potential secret material or real IP-derived origin found in the repository.' >&2
            exit 1
          fi
          # Hardcoded weak JWT secrets or database passwords in committed env
          # files (two-stage grep: match assignments, then exclude known
          # placeholder values so CI fixtures and examples keep passing).
          if grep -rInE '^(JWT_SECRET|POSTGRES_PASSWORD)=' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
              --exclude-dir=fixtures . 2>/dev/null | \
              grep -vE '(CHANGE_ME|replace-with|ci-only|example|test|<unique-)' ; then
            echo 'Hardcoded JWT_SECRET or POSTGRES_PASSWORD found in committed env file. Generate unique secrets per environment (openssl rand -base64 48).' >&2
            exit 1
          fi
