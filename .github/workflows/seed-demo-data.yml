name: Seed Demo Data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: deploy-dashpoint-demo
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Prepare seed payload
        run: |
          set -euo pipefail
          printf '%s' "$DEMO_SEED_DATA" | base64 -d > /tmp/seed.sql.gz
          printf '%s' "$DEMO_SEED_IMG_1" > /tmp/img1.b64
          printf '%s' "$DEMO_SEED_IMG_2" > /tmp/img2.b64
          printf '%s' "$DEMO_SEED_IMG_3" > /tmp/img3.b64
          cat /tmp/img1.b64 /tmp/img2.b64 /tmp/img3.b64 | base64 -d > /tmp/upload.jpg
          ls -la /tmp/seed.sql.gz /tmp/upload.jpg
        env:
          DEMO_SEED_DATA: ${{ secrets.DEMO_SEED_DATA }}
          DEMO_SEED_IMG_1: ${{ secrets.DEMO_SEED_IMG_1 }}
          DEMO_SEED_IMG_2: ${{ secrets.DEMO_SEED_IMG_2 }}
          DEMO_SEED_IMG_3: ${{ secrets.DEMO_SEED_IMG_3 }}

      - name: Import into demo VPS
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > /tmp/known_hosts
          ssh_opts=(-i /tmp/deploy_key -o BatchMode=yes -o UserKnownHostsFile=/tmp/known_hosts -o StrictHostKeyChecking=yes)

          gzip -t /tmp/seed.sql.gz
          scp "${ssh_opts[@]}" /tmp/seed.sql.gz "$VPS_USER@$VPS_HOST:/tmp/demo_seed.sql.gz"
          scp "${ssh_opts[@]}" /tmp/upload.jpg "$VPS_USER@$VPS_HOST:/tmp/demo_upload.jpg"

          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            PG=dashpoint-demo-db-prod
            APP=dashpoint-demo-backend-prod
            docker ps --format '{{.Names}}' | grep -q \"\$PG\" || { echo 'DB container not running' >&2; exit 1; }
            docker ps --format '{{.Names}}' | grep -q \"\$APP\" || { echo 'Backend container not running' >&2; exit 1; }
            docker exec "\$PG" psql -U dashpoint_demo_user -d dashpoint_demo_prod -v ON_ERROR_STOP=1 -c "TRUNCATE payments, sale_items, sales, shifts, stock_adjustments, expenses, inventory_items, products, categories, users CASCADE;"
            gunzip -c /tmp/demo_seed.sql.gz | docker exec -i \"\$PG\" psql -U dashpoint_demo_user -d dashpoint_demo_prod -v ON_ERROR_STOP=1
            docker cp /tmp/demo_upload.jpg \"\$APP\":/app/uploads/52e688b2-dd4d-4cfb-8bf0-e7d2546d0fad.jpg
            docker exec -u root \"\$APP\" chown dashpoint:dashpoint /app/uploads/52e688b2-dd4d-4cfb-8bf0-e7d2546d0fad.jpg || true
            rm -f /tmp/demo_seed.sql.gz /tmp/demo_upload.jpg
            echo IMPORT-DONE
          "
