name: Seed Demo Diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: deploy-dashpoint-demo
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Discover demo layout
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > /tmp/known_hosts
          ssh -i /tmp/deploy_key -o BatchMode=yes -o UserKnownHostsFile=/tmp/known_hosts -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "
            echo '=== app dir:' $VPS_APP_DIR
            ls -la $VPS_APP_DIR | head -20
            echo '=== env files:'
            find $VPS_APP_DIR -maxdepth 2 -name '.env*' 2>/dev/null | head -10
            echo '=== PROJECT/POSTGRES in each env:'
            for f in \$(find $VPS_APP_DIR -maxdepth 2 -name '.env*' 2>/dev/null); do echo \"-- \$f\"; grep -E '^(PROJECT_NAME|POSTGRES_USER|POSTGRES_DB|CADDY_SITE_ADDRESS)=' \"\$f\" 2>/dev/null; done
            echo '=== running containers:'
            docker ps --format '{{.Names}}  {{.Image}}'
          "
