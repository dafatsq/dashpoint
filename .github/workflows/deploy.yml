name: Test And Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      client_env:
        description: Optional client env filename, for example .env.acme. Empty deploys all active clients.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Group per triggering branch so a push to one branch cannot supersede a
  # queued run for another (GitHub cancels an older *pending* run in the
  # same group when a newer event arrives, which previously swallowed the
  # demo deploy when main and dashpoint-demo were pushed together).
  group: dashpoint-production-deploy-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  scope:
    name: Select deployment source
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (startsWith(github.event.workflow_run.head_branch, 'clients/') ||
        github.event.workflow_run.head_branch == 'dashpoint-demo')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.scope.outputs.should_deploy }}
      source_sha: ${{ steps.scope.outputs.source_sha }}
      client_env_filter: ${{ steps.scope.outputs.client_env_filter }}
      environment: ${{ steps.scope.outputs.environment }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Determine whether a VPS deployment is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # A push to clients/<slug> deploys only that client: map the branch
          # to its env file so co-located clients are never touched by
          # another client's deploy.
          filter=""
          case "${WORKFLOW_RUN_HEAD_BRANCH:-}" in
            clients/*)
              slug="${WORKFLOW_RUN_HEAD_BRANCH#clients/}"
              if [[ ! "$slug" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
                echo "Invalid client branch slug: $slug" >&2
                exit 1
              fi
              filter=".env.$slug"
              ;;
          esac
          printf 'client_env_filter=%s\n' "$filter" >> "$GITHUB_OUTPUT"

          # Per-VPS targeting: each deployment branch maps to a GitHub
          # environment (deploy-<slug>) holding that VPS's VPS_* secrets.
          # Environments without their own secrets fall back to the
          # repository-level VPS_* secrets.
          branch="${WORKFLOW_RUN_HEAD_BRANCH:-${GITHUB_REF_NAME}}"
          env_name="deploy-dashpoint-demo"
          case "$branch" in
            clients/*)
              slug="${branch#clients/}"
              if [[ ! "$slug" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
                echo "Invalid client branch slug: $slug" >&2
                exit 1
              fi
              env_name="deploy-$slug"
              ;;
          esac
          printf 'environment=%s\n' "$env_name" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$SOURCE_SHA^1" "$SOURCE_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(backend/|frontend/|docker-compose[^/]*\.yml$|[^/]*Dockerfile[^/]*$|Caddyfile$|CLIENTS/|scripts/deploy-vps\.sh$|scripts/render-caddyfile\.sh$|scripts/[^/]*\.env[^/]*$|\.env\.example$)'; then
            echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
          fi

  quality:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  deployment_validation:
    name: Validate deployment configuration
    needs: [scope, quality]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.should_deploy == 'true' &&
      (github.event_name == 'workflow_run' || needs.quality.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scope.outputs.source_sha }}

      - name: Validate production Compose configuration
        run: |
          docker compose \
            --env-file ci/fixtures/compose.env \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Render and validate Caddy configuration
        run: |
          caddy_dir="$(mktemp -d)"
          trap 'rm -rf "$caddy_dir"' EXIT
          cp ci/fixtures/compose.env "$caddy_dir/.env.ci"
          scripts/render-caddyfile.sh "$caddy_dir" "$caddy_dir/Caddyfile"
          docker run --rm \
            --mount "type=bind,src=$caddy_dir/Caddyfile,dst=/etc/caddy/Caddyfile,readonly" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile

  deploy:
    name: Deploy to VPS
    needs: [scope, quality, deployment_validation]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.should_deploy == 'true' &&
      needs.deployment_validation.result == 'success' &&
      (github.event_name == 'workflow_run' || needs.quality.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Per-VPS targeting: the environment selected from the deployment branch
    # (deploy-<slug>) provides that VPS's VPS_* secrets, overriding the
    # repository-level fallbacks. Environments can also carry required-
    # reviewer protection rules.
    environment: ${{ needs.scope.outputs.environment }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_CLIENT_ENV_DIR: ${{ secrets.VPS_CLIENT_ENV_DIR }}
      VPS_CADDY_FILE: ${{ secrets.VPS_CADDY_FILE }}
      VPS_CLIENT_ENV_FILTER: ${{ inputs.client_env || needs.scope.outputs.client_env_filter }}
      SOURCE_SHA: ${{ needs.scope.outputs.source_sha }}
    steps:
      - name: Check out pushed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scope.outputs.source_sha }}
          fetch-depth: 0

      - name: Validate deployment settings
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_APP_DIR; do
            if [[ -z "${!name}" ]]; then
              echo "$name is not configured" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Synchronize pushed source to VPS
        run: |
          set -euo pipefail
          printf -v remote_app '%q' "$VPS_APP_DIR"
          # Keepalives keep NAT/firewall state alive during long remote builds;
          # without them the SSH session can drop mid-deploy ("Timeout, server
          # not responding").
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$VPS_USER@$VPS_HOST" \
              "tar -xf - -C $remote_app" < <(git archive --format=tar "$SOURCE_SHA")
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$VPS_USER@$VPS_HOST" \
            "printf '%s\\n' '$SOURCE_SHA' > $remote_app/.deploy-commit && chmod 600 $remote_app/.deploy-commit"

      - name: Build and ship images to VPS
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          # Building Next.js on a small VPS gets OOM-killed; build here
          # (7 GB runner RAM) and stream the images to the VPS instead.
          # The tag is the source commit, so the VPS always knows exactly
          # what is running. Demo credentials are a constant in the demo
          # branch's frontend code — no build args needed.
          docker build --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            -t "dashpoint-frontend:$SOURCE_SHA" frontend
          docker build \
            -t "dashpoint-backend:$SOURCE_SHA" backend
          docker save "dashpoint-backend:$SOURCE_SHA" | \
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "docker load"
          docker save "dashpoint-frontend:$SOURCE_SHA" | \
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "docker load"

      - name: Deploy selected client stacks
        run: |
          set -euo pipefail
          printf -v remote_app '%q' "$VPS_APP_DIR"
          printf -v remote_env_dir '%q' "${VPS_CLIENT_ENV_DIR:-CLIENTS}"
          printf -v remote_caddy_file '%q' "$VPS_CADDY_FILE"
          printf -v remote_filter '%q' "$VPS_CLIENT_ENV_FILTER"
          printf -v remote_script '%q' "$VPS_APP_DIR/scripts/deploy-vps.sh"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10)

          # The remote build can take ~20 minutes. Run it detached from SSH
          # (a dropped or reset connection must not kill a half-finished
          # build) and poll with short-lived connections. COMPOSE_PARALLEL_LIMIT=1
          # serializes the backend/frontend builds to avoid exhausting a
          # small VPS, which otherwise resets sshd connections mid-build.
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "
            rm -f $remote_app/.deploy-exit
            nohup sh -c 'APP_DIR=$remote_app CLIENT_ENV_DIR=$remote_env_dir CADDY_FILE=$remote_caddy_file CLIENT_ENV_FILTER=$remote_filter COMPOSE_PARALLEL_LIMIT=1 DEPLOY_TAG=$SOURCE_SHA $remote_script > $remote_app/.deploy-log 2>&1; echo \$? > $remote_app/.deploy-exit' >/dev/null 2>&1 &
          "

          for _ in $(seq 1 80); do
            sleep 30
            exit_code=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
              "cat $remote_app/.deploy-exit 2>/dev/null" 2>/dev/null) || continue
            if [[ -n "$exit_code" ]]; then
              ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
                "tail -n 80 $remote_app/.deploy-log" >&2 || true
              if [[ "$exit_code" == "0" ]]; then
                exit 0
              fi
              exit 1
            fi
          done
          echo "Remote deploy did not finish within 40 minutes" >&2
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "tail -n 80 $remote_app/.deploy-log" >&2 || true
          exit 1
