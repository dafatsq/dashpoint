services:
  db:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME}-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-backend-prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required and must use sslmode=require, verify-ca, or verify-full}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
      REFRESH_EXPIRY_HOURS: ${REFRESH_EXPIRY_HOURS:-168}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      PORT: "8080"
      ENVIRONMENT: production
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
